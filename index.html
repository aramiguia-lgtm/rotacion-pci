<html lang="es"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Leadership PCI Miami · Gestión de grupos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna de teléfono; pestañas arriba, bloques de 2 h como tarjetas. */
:root{--bg:#EDF1F4;--card:#FFFFFF;--ink:#17232E;--muted:#586774;--line:#D1D9E0;--accent:#0B7A75;--onaccent:#FFFFFF;--bad:#B93A2B;--warnbg:#FFF4E5;--warnink:#7A4A00;--now:#E3F4F3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F171E;--card:#18232D;--ink:#E8EFF4;--muted:#9AA9B7;--line:#2C3A47;--accent:#35C0B8;--onaccent:#05201E;--bad:#FF8070;--warnbg:#2E2410;--warnink:#F2C879;--now:#12302F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F171E;--card:#18232D;--ink:#E8EFF4;--muted:#9AA9B7;--line:#2C3A47;--accent:#35C0B8;--onaccent:#05201E;--bad:#FF8070;--warnbg:#2E2410;--warnink:#F2C879;--now:#12302F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-size:18px;margin:0}
#app{max-width:560px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:30px;line-height:1.1;margin:4px 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:22px;margin:0 0 8px;font-weight:700}
h2.lh{margin-top:22px}
.sub{color:var(--muted);margin:0 0 12px;font-size:17px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:19px;background:var(--accent);color:var(--onaccent);cursor:pointer;text-align:center;margin-top:12px}
#app.ro .rolk{opacity:.55;cursor:not-allowed}
.cbox{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line)}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;min-width:0}
textarea{min-height:90px;resize:vertical}
.tabs{display:flex;gap:5px;margin:10px 0 14px}
a.home{display:inline-block;color:var(--muted);font-weight:600;text-decoration:none;padding:6px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alert{background:var(--warnbg);color:var(--warnink);border:2px solid var(--warnink);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:17px}
.alert.soft{background:var(--card);color:var(--ink);border-color:var(--line)}
.tab{flex:1;min-width:0;font-size:15px !important;padding:10px 1px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:17px}
.toast{background:var(--accent);color:var(--onaccent);padding:10px 12px;border-radius:12px;font-weight:700;margin:10px 0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 input{font-size:17px;padding:9px}
.row3 label{margin-top:10px;font-size:16px}
.stops{color:var(--muted);font-size:16px;margin:8px 0}
.stops b{color:var(--ink)}
.blk{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.blk.now{border-color:var(--accent);background:var(--now)}
.blk.next{border-style:dashed}
.blk h3{margin:0 0 6px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.blk h3 span{color:var(--muted);font-size:16px;font-weight:600;margin-left:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-of-type{border-bottom:0}
.mrow span{font-weight:600;font-variant-numeric:tabular-nums}
.mrow .who{font-weight:500}
select.miss{border-color:var(--bad)}
.free{color:var(--muted);font-size:16px;margin:8px 0 0}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.prow .nm{flex:1 1 130px}
.prow select{width:auto;flex:none}
.prow .num{font-size:22px;min-width:34px;font-variant-numeric:tabular-nums}
.pill{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.pill.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.pill.stop{border-color:var(--bad);color:var(--bad)}
.tag{font-size:15px;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;padding:8px;cursor:pointer}
.x.del{color:var(--bad)}
:root{--u1:#1F5FAE;--u1b:#E3EEFB;--u2:#A34A06;--u2b:#FDEFD9;--u0:#7A3FB0;--u0b:#F1E7FA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--u1:#8CB8F0;--u1b:#17304D;--u2:#F2B36B;--u2b:#3A2810;--u0:#C9A2EE;--u0b:#2E1D40}}
:root[data-theme="dark"]{--u1:#8CB8F0;--u1b:#17304D;--u2:#F2B36B;--u2b:#3A2810;--u0:#C9A2EE;--u0b:#2E1D40}
.brk{margin-top:10px;border-top:2px dashed var(--line);padding-top:8px}
.brk.on{border:2px solid var(--accent);border-radius:12px;padding:8px 10px;background:var(--now)}
.bh{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.bh span{color:var(--muted);font-weight:600}
.tn{display:block;width:max-content;margin:0 0 6px;padding:6px 16px;border-radius:12px;font-size:24px;font-weight:700;letter-spacing:.03em;color:#fff}
.tn1{background:#9A6A00}.tn2{background:#2F6B2B}.tn3{background:#1C3F8A}
.brow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .op{flex:1 1 150px;min-width:0;font-weight:600}
.brow .op small{display:block;color:var(--muted);font-size:15px;font-weight:500}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px;border:2px solid currentColor}
.c1{color:var(--u1);background:var(--u1b)}.c2{color:var(--u2);background:var(--u2b)}.c0{color:var(--u0);background:var(--u0b)}
.cf{color:var(--accent);background:var(--now)}
.cs{color:var(--ink);background:var(--card);border-style:double;border-width:3px}
.ch{color:var(--warnink);background:var(--warnbg);border-style:dashed}
.mrow.held{background:repeating-linear-gradient(135deg,var(--warnbg) 0 10px,var(--card) 10px 20px);border-radius:10px;padding:6px 8px;border-bottom:0;margin:2px 0}
.mrow.held span small{display:block;color:var(--warnink);font-size:14px;font-weight:600}
.pill.hold{border-color:var(--warnink);color:var(--warnink);background:var(--warnbg)}
.pill.ghost{opacity:.55}
.rt{display:inline-block;margin-top:4px;border:2px solid var(--warnink);color:var(--warnink);background:var(--card);border-radius:999px;padding:4px 10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.rtbox{background:var(--card);border:2px solid var(--warnink);border-radius:16px;padding:12px;margin-top:14px}
.rtbox h2{margin:0 0 4px;color:var(--warnink)}
.rtbox .prow{margin-top:6px}
.rt.on{background:var(--warnink);color:var(--warnbg)}
.mrow.held .who b{display:block;color:var(--warnink);font-size:15px}
.mrow.held .rtname{font-weight:700}
.mrow.held .rtname small{display:block;color:var(--warnink);font-size:15px}
.cx{color:var(--warnink);background:var(--warnbg)}.cn{color:var(--bad);background:var(--card)}.cm{color:var(--muted);background:var(--card);border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bnow{border:2px solid var(--accent);background:var(--card);border-radius:16px;padding:10px 12px;margin:10px 0}
.bnow .brk{border:0;margin:0;padding:0}
.grp{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:8px}
.grp b{display:block;margin-bottom:4px}
.grp select{margin-top:6px}
.pr h1{margin:0}.pr h2{margin:16px 0 6px;font-size:22px}
.pr table{width:100%;border-collapse:collapse;font-size:16px;background:var(--card)}
.pr th,.pr td{border:1px solid var(--ink);padding:5px 7px;text-align:left;vertical-align:top}
.pr th{background:var(--line)}
.pr td.hr{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pr small{display:block;color:var(--muted);font-size:13px}
.pr td.cv{font-weight:700}.pr td.nc{color:var(--muted)}.pr td.bad{color:var(--bad);font-weight:700}
.pr i,.lbl i{font-style:normal;color:var(--muted);font-size:.85em}
.cp .phd{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.cp .phd span{font-size:15px;color:var(--muted)}
.cp h2{margin:8px 0 3px;font-size:18px}
.cp table{font-size:14px}.cp th,.cp td{padding:2px 6px;white-space:nowrap}
.cp td.cv,.cp td.nc,.cp td.bad{white-space:normal}
.cp tr.tb td{border-top:2px solid var(--ink)}
.zb{display:flex;flex-wrap:wrap;gap:12px}
.lbl{overflow:hidden;box-sizing:border-box;background:#fff;color:#000;border:1px dashed #888;padding:.09in .12in;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.15}
.lbl .lh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:1.25em;border-bottom:2px solid #000;padding-bottom:2px}
.lbl .lh span{font-weight:700;font-size:.95em;white-space:nowrap}
.lbl .ld{font-size:.65em;margin:1px 0 3px}
.lbl table{width:100%;border-collapse:collapse;table-layout:fixed}
.lbl th:nth-child(1){width:37%}.lbl th:nth-child(2){width:21%}
.lbl td{overflow-wrap:anywhere}
.lbl th{font-size:.65em;text-align:left;border-bottom:1px solid #000;padding:1px 2px}
.lbl td{border-bottom:1px solid #999;padding:.25em 2px;vertical-align:top;font-weight:600}
.lbl td.cv{font-weight:800}.lbl td.nc{font-weight:400}.lbl td.bad{font-weight:900;text-decoration:underline}
.lbl i{color:#000;font-weight:400;font-size:.72em}
.lbl.tight{font-size:12.5px}.lbl.tight td{padding:2px 2px}
.pbar{display:flex;gap:8px}
.lbl.note .nh,.ncard .nh{font-size:1.35em;border-bottom:2px solid #000;padding-bottom:2px;margin-bottom:3px}
.lbl.note .no,.ncard .no{font-size:.9em;margin:2px 0 4px;font-weight:600}
.lbl.note td i,.ncard td i{display:block;font-size:.7em}
.lbl.note .ld,.ncard .ld{margin-top:4px}
.ncards{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ncard{border:1.5px dashed #555;padding:10px 12px;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:14px;break-inside:avoid;page-break-inside:avoid}
.ncard table{width:100%;border-collapse:collapse}.ncard th{font-size:11px;text-align:left;border-bottom:1px solid #000}.ncard td{border-bottom:1px solid #aaa;padding:3px 2px;vertical-align:top}.ncard .ld{font-size:10px}
@media (max-width:520px){.ncards{grid-template-columns:1fr}}
@media print{.ncards{grid-template-columns:1fr 1fr}}
select.mv{flex-basis:100%;font-size:15px;padding:6px 8px;border-radius:10px;color:var(--muted)}
.op b.mvd{display:block;color:var(--accent);font-size:14px}
.pill.zero{border-color:var(--u0);color:var(--u0);background:var(--u0b)}
.mrow.zero{background:var(--u0b);border-radius:10px;padding:6px 8px;border-bottom:0;margin:2px 0}
.mrow.zero span small{display:block;color:var(--u0);font-size:14px;font-weight:600}
.zh{margin:10px 0 2px;font-weight:700;color:var(--u0);font-size:16px}
.mrow .hctl{grid-column:1/-1}
.mrow select.tk{border-color:var(--warnink);font-size:16px;padding:8px}
.zcp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.zcp .pill{padding:6px 12px}.zcp small{font-weight:500;font-size:13px}
.rnow{border:2px solid var(--accent);background:var(--now);border-radius:16px;padding:10px 12px;margin:6px 0 10px}
.rnow .rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.rnow .rh span{color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap}
.rnow .rr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:17px}
.rnow .rr:last-of-type{border-bottom:0}
.rnow .rr b{font-variant-numeric:tabular-nums}
.rnow .rr.h{color:var(--warnink)}
.rnow .rr small{display:block;color:var(--muted);font-size:14px}
.rnow .go{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:6px 0 0;cursor:pointer}
.ahora{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;margin:10px 0}
.ahora h2{margin:0 0 2px;font-size:22px}
.ahora .lnh{margin:8px 0 2px;font-weight:700;color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.arow{display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:4px 10px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
.arow:last-child{border-bottom:0}
.arow .mq{font-weight:700;font-variant-numeric:tabular-nums}
.arow .pp{font-weight:700}
.arow .pp small{display:block;font-weight:500;color:var(--muted);font-size:15px}
.arow.h .pp{color:var(--warnink)}.arow.z .mq{color:var(--u0)}.arow.x .pp{color:var(--bad)}.pbar .btn{margin:0 0 12px}
@media print{
:root{--card:#fff;--ink:#000;--muted:#333;--line:#ddd;--bad:#000}
body{background:#fff!important;color:#000;padding:0!important;font-size:14px}
#app{max-width:none;padding:0}.noprint,#homebtn{display:none!important}
.pr table{font-size:13px;page-break-inside:auto}.pr tr{page-break-inside:avoid}
.pr h2{margin:10px 0 4px;font-size:18px}
.cp table{font-size:14px}.cp th,.cp td{padding:3px 6px}.cp h2{margin:10px 0 3px;font-size:18px}.cp .phd{font-size:20px}
.zb{display:block}.lbl{border:0;margin:.125in auto 0;page-break-after:always;break-after:page}.lbl:last-child{page-break-after:auto;break-after:auto}}

.cal{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.calh b{font-size:22px}.calh b::first-letter{text-transform:uppercase}
.tabs.mt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#app{padding-bottom:90px}
.calh button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;font-size:20px;padding:4px 14px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cg .dw{text-align:center;font-size:14px;font-weight:700;color:var(--muted);padding:2px 0}
.cd{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.cd small{font-size:11px;font-weight:600;line-height:1}
.cd.w{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.cd.v{background:var(--u0b);border-color:var(--u0);color:var(--u0)}
.cd.t{outline:3px solid var(--ink);outline-offset:1px}
.cd.ov::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warnink)}
.cd.w.ov::after{background:var(--onaccent)}
.cd.e{visibility:hidden}
.csum{display:flex;gap:8px;margin:10px 0 2px}
.csum div{flex:1;background:var(--bg);border-radius:12px;padding:6px 8px;text-align:center;font-size:15px;color:var(--muted)}
.csum b{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.wdp{display:flex;gap:4px}.wdp .pill{flex:1;padding:8px 0;min-width:0}
.ctoday{font-size:20px;font-weight:700;margin:4px 0 0}
@media print{.cd.w{background:#000!important;color:#fff!important}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Grupos */
.gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gtop h1{margin-bottom:2px}
.shiftchip{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:16px;background:var(--warnbg);color:var(--warnink);border:2px solid var(--warnink)}
.shiftchip.n{background:var(--u1b);color:var(--u1);border-color:var(--u1)}
.hbtns{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.pill.new{background:var(--accent);color:var(--onaccent);border-color:var(--accent);padding:7px 12px;font-size:16px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;font-size:16px;padding:6px 0;cursor:pointer;text-decoration:underline}
.ex{background:var(--u0b);color:var(--u0);border:2px dashed var(--u0);border-radius:12px;padding:8px 12px;margin:10px 0;font-weight:600;font-size:16px}
.glist{display:grid;gap:8px;margin-top:8px}
.gbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font:inherit;font-weight:700;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.gbtn small{font-weight:600;color:var(--muted);font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-weight:700;font-size:18px;padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button small{display:block;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{border-color:var(--accent);background:var(--now)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:110px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.guide p{margin:6px 0}
.guide ol{padding-left:24px;margin:6px 0}.guide li{margin:6px 0}
.guide .step{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.guide .step h3{margin:0 0 4px;display:flex;gap:10px;align-items:center;font-size:20px}
.guide .step h3 b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-size:18px;flex:none}
.guide dt{font-weight:700;margin-top:10px}.guide dd{margin:2px 0 0 0;color:var(--muted)}

.legend .swl{padding:4px 12px;font-size:16px;border-style:dashed}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
/* Horario del grupo: el turno de noche (18:00 a 6:00) que empezó ayer sigue siendo "hoy" hasta las 6:00. */
let SHIFT='dia';
const todayStr=()=>{const t=new Date();if(SHIFT==='noche'&&t.getHours()<6)t.setDate(t.getDate()-1);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const REASONS=['Logística','Ventas','RRHH','Mantenimiento correctivo','Mantenimiento preventivo','Cambio de molde','Operaciones'];
const reasonOpts=cur=>(cur&&REASONS.indexOf(cur)<0?[cur]:[]).concat(REASONS).map(r=>`<option value="${esc(r)}" ${r===cur?'selected':''}>${esc(r)}</option>`).join('');

const L1=[1,2,3,4,5,6,7,8,10,11],L2=[12,13,14,15,16,17,18,19,21,22];
function newFull(g,shift,l1,l2){
const machines=(l1||L1).map(n=>({n,line:1,on:true,reason:''})).concat((l2||L2).map(n=>({n,line:2,on:true,reason:''})));
const noche=shift==='noche';
return {g:String(g),shift:noche?'noche':'dia',machines,posts:machines.map(m=>({id:uid(),ms:[m.n]})),people:[],days:{},vac:[],informa:'',cal:{mode:'ciclo',on:1,off:0,start:todayStr(),wd:[1,2,3,4,5],ov:{},pid:''},
brk:noche?{bS:'21:00',bM:15,lS:'01:00',lM:30,g:[[],[],[]]}:{bS:'07:00',bM:15,lS:'12:00',lM:30,g:[[],[],[]]},brkInit:1,brkOrd:2};
}
function defaults(){return newFull('','dia')}
let S=defaults();
let printing=false,db=null,tab='hoy',date=todayStr(),armed=null,notice=null,fromSel=null;

/* Guardado: en la nube de Claude (se ve en todos tus dispositivos); si no está disponible, en este navegador. */
let cdb=null,ready=false,lastW={},chains={},pend=0,flushT=null;
const openDB=()=>new Promise(res=>{try{const r=indexedDB.open('rotacion',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}});
const kvGet=k=>new Promise(res=>{if(!db)return res(null);try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result==null?null:r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const kvPut=(k,v)=>{if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}};
const clone=o=>JSON.parse(JSON.stringify(o));
/* Guardado: solo en este dispositivo, separado por número de grupo. Un grupo nunca toca los datos de otro. */
const GKEY='rotgrupos:';
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
let saveT=null,saveFail=false,cDirty=false;
let autoGen=false;
function save(){if(!S||!S.g||S.example)return;if(!autoGen)cDirty=true;clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){clearTimeout(saveT);saveT=null;if(!S||!S.g||S.example)return;S.saved=Date.now();const dirty=cDirty;if(dirty)S.edit=S.saved;const ok=lsSet(GKEY+'g:'+S.g,S);lsSet(GKEY+'last',S.g);if(ok&&dirty){cDirty=false;window.cloud&&cloud.changed(S.g)}if(ok)plantCheck();if(!ok&&!saveFail){saveFail=true;notice={t:'No se pudo guardar en este dispositivo. Revisa que el navegador permita guardar datos de sitios.',bad:true};rr()}}
window.addEventListener('pagehide',()=>{if(saveT)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)saveNow()});
const mainOf=()=>{const o=Object.assign({},S);delete o.days;return clone(o)};
function wr(path,data){
const j=JSON.stringify(data);if(lastW[path]===j)return;lastW[path]=j;pend++;
const run=()=>cdb.doc(path).set(data);
const p=(chains[path]||Promise.resolve()).then(run,run);
chains[path]=p.then(()=>{pend--},e=>{pend--;delete lastW[path];notice={t:e&&e.code==='quota_exceeded'?'Se llenó el espacio en la nube. No se guardó el último cambio.':'No se pudo guardar en la nube. Revisa tu conexión y vuelve a hacer el cambio.',bad:true};rr()});
}
function flush(){if(!cdb)return;clearTimeout(flushT);flushT=null;wr('state/main',mainOf());Object.keys(S.days).forEach(k=>wr('days/'+k,S.days[k]))}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&flushT)flush()});
function applyRemote(){if(pend||flushT)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;rr()}
function fixS(){if(!S.days)S.days={};if(!S.cal||typeof S.cal!=='object')S.cal={mode:'ciclo',on:5,off:2,start:todayStr(),wd:[1,2,3,4,5],ov:{},pid:''};if(!S.cal.ov)S.cal.ov={};if(!Array.isArray(S.vac))S.vac=[];if(!Array.isArray(S.people))S.people=[]}
function mergeVac(local){
let n=0;const nameOf=id=>{const p=(local.people||[]).find(x=>x.id===id);return p?norm(p.name):''};
(local.vac||[]).forEach(v=>{if(S.vac.some(x=>x.id===v.id))return;const p=S.people.find(x=>norm(x.name)===nameOf(v.pid));if(!p||S.vac.some(x=>x.pid===p.id&&x.from===v.from&&x.to===v.to))return;S.vac.push(Object.assign({},v,{pid:p.id}));n++});
return n;
}
async function initCloud(d,local,migrated){
const [m,ds]=await Promise.all([d.doc('state/main').get(),d.collection('days').get()]);
cdb=d;
if(m.exists){
S=Object.assign(clone(m.data()),{days:{}});ds.docs.forEach(x=>S.days[x.id]=clone(x.data()));fixS();
lastW['state/main']=JSON.stringify(mainOf());Object.keys(S.days).forEach(k=>lastW['days/'+k]=JSON.stringify(S.days[k]));
if(local&&!migrated){const n=mergeVac(local);if(n){notice={t:n+' vacaciones de este dispositivo se agregaron a la nube.'};save()}}
}else{
if(local)S=local;fixS();flush();
}
kvPut('migrated',true);
cdb.doc('state/main').onSnapshot(s=>{
if(!s.exists||s.metadata.hasPendingWrites||pend||flushT)return;
const o=clone(s.data()),days=S.days;S=Object.assign(o,{days});fixS();lastW['state/main']=JSON.stringify(mainOf());applyRemote();
},()=>{});
cdb.collection('days').onSnapshot(s=>{
if(s.metadata.hasPendingWrites||pend||flushT)return;
let ch=false;s.docs.forEach(x=>{const o=clone(x.data()),j=JSON.stringify(o);if(lastW['days/'+x.id]!==j){lastW['days/'+x.id]=j;S.days[x.id]=o;ch=true}});
if(ch)applyRemote();
},()=>{});
}

/* Día de trabajo */
function day(){if(!S.days[date])S.days[date]={start:S.shift==='noche'?'18:00':'06:00',hours:2,n:6,blocks:[],dirty:false,nextRing:null};return S.days[date]}
const toMin=s=>{const p=String(s||'06:00').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const hm=(start,add)=>{const t=(toMin(start)+Math.round(add))%1440;return pad(Math.floor(t/60))+':'+pad(t%60)};
const blockLabel=(d,i)=>hm(d.start,i*d.hours*60)+' – '+hm(d.start,(i+1)*d.hours*60);
function curBlock(d){
if(date!==todayStr())return -1;
const now=new Date(),mins=now.getHours()*60+now.getMinutes();
const diff=(mins-toMin(d.start)+1440)%1440,i=Math.floor(diff/(d.hours*60));
return i<d.n?i:-1;
}
const machOn=n=>{const m=S.machines.find(x=>x.n===n);return !!(m&&m.on&&!m.zero)};
const postActive=p=>p.ms.some(machOn)||postZCX(p).length>0;
/* Detenida por un motivo pero sigue en la rotación: el operario queda asignado y libre para cubrir descansos. */
const held=n=>{const m=S.machines.find(x=>x.n===n);return !!(m&&m.on&&m.hold)};
const postHeld=p=>{const a=p.ms.filter(machOn);return a.length>0&&a.every(held)};
/* Retrabajo: quien pasa por esa máquina detenida va a retrabajo y no cubre descansos. */
const postRT=p=>postHeld(p)&&p.ms.some(n=>{const m=S.machines.find(x=>x.n===n);return m&&m.on&&m.hold&&m.task==='rt'});
/* Cubre como utility: quien pasa por esa máquina detenida cubre descansos como un utility (Utility), en cualquier línea. */
const postUT=p=>postHeld(p)&&heldOf(p).some(m=>m.task==='ut');
function setRT(pid,on){const p=S.posts.find(x=>x.id===pid);if(!p)return;S.machines.forEach(m=>{if(p.ms.indexOf(m.n)>=0&&m.on&&m.hold)m.task=on?'rt':''});save();notice={t:on?'Máq. '+postLabel(p)+': quien pasa por ahí va a retrabajo.':'Máq. '+postLabel(p)+': el operario vuelve a cubrir descansos.'};rr()}
const pname=id=>{const p=S.people.find(x=>x.id===id);return p?p.name:'?'};
const mk=p=>p&&p.role==='util'?' (U)':p&&p.role==='senior'?' (US)':p&&p.role==='utl'?' (U)':p&&p.role==='sup'?' (Sup.)':'';
const pmark=id=>mk(S.people.find(x=>x.id===id));
const postLabel=p=>p.ms.join(', ')+(p.sfx||''); const mql=r=>(r.ms||[]).join(', ')+(r.sx||'');
const addDays=(s,n)=>{const p=s.split('-').map(Number),t=new Date(p[0],p[1]-1,p[2]+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const fmtD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'})};
const onVac=(id,d)=>(S.vac||[]).some(v=>v.pid===id&&v.from<=d&&d<=v.to);
/* Tipo de ausencia registrada: vacaciones o enfermedad (las viejas con «enfermedad» en la nota cuentan como enfermedad). */
const vKind=v=>v.kind?(v.kind==='vac'?'vac':'enf'):(/enferm/i.test(v.note||'')?'enf':'vac');
const vSick=v=>v.kind==='enfermo'?'se reportó enfermo':'se reportó enferma';
const vacOf=(id,d)=>(S.vac||[]).find(v=>v.pid===id&&v.from<=d&&d<=v.to);
const vWord=v=>vKind(v)==='enf'?'enfermedad':'vacaciones';
const leftOn=(id,ds)=>{const d=S.days[ds];return d&&d.left&&d.left[id]||null};
const here=p=>p.present&&!onVac(p.id,date)&&!leftOn(p.id,date);
function alertsHTML(){
const T=todayStr(),tm=addDays(T,1),nm=id=>esc(pname(id));
const start=S.vac.filter(v=>v.from===tm),back=S.vac.filter(v=>addDays(v.to,1)===tm),now=S.vac.filter(v=>v.from<=T&&T<=v.to);
let h='';
if(start.length)h+=`<div class="alert"><b>Mañana empieza${start.length>1?'n':''} ${start.every(v=>vKind(v)==='enf')?'ausencia por enfermedad':'vacaciones'}:</b> ${start.map(v=>nm(v.pid)+(vKind(v)==='enf'?' · enfermedad':'')+' (hasta el '+fmtD(v.to)+')').join(', ')}</div>`;
if(back.length)h+=`<div class="alert soft"><b>Mañana regresa${back.length>1?'n':''}:</b> ${back.map(v=>nm(v.pid)+' (de '+vWord(v)+')').join(', ')}</div>`;
if(now.length)h+=`<p class="stops">Ausentes hoy: ${now.map(v=>'<b>'+nm(v.pid)+'</b> ('+vWord(v)+') hasta el '+fmtD(v.to)).join(' · ')}</p>`;
return h;
}
function vacHTML(){
const T=todayStr();
let h='';
if(!S.people.length)return h+`<div class="warn">Agrega personal primero en la pestaña Personal.</div>`;
if(vacOpen&&!isRO()){h+=`<div class="cbox" id="vac_add"><h2 style="margin-top:0">Registrar vacaciones o ausencia</h2><p class="sub" style="margin-top:0">Esos días la persona sale de la rotación, y la app avisa el día antes.</p>`;
h+=`<label for="vp">Persona</label><select id="vp">${S.people.map(p=>`<option value="${p.id}">${esc(p.name)}${mk(p)}</option>`).join('')}</select>`;
h+=`<div class="row2"><div><label for="vf">Desde</label><input type="date" id="vf" value="${addDays(T,1)}"></div><div><label for="vt">Hasta (último día)</label><input type="date" id="vt" value="${addDays(T,7)}"></div></div>`;
h+=`<label for="vk">Motivo</label><select id="vk"><option value="vac">Vacaciones</option><option value="enferma">Se reportó enferma</option><option value="enfermo">Se reportó enfermo</option></select>`;
h+=`<label for="vn">Nota (opcional)</label><input id="vn" placeholder="Ej. papel aprobado por RRHH">`;
h+=`<div class="pbar" style="margin-top:12px"><button class="btn" style="margin-top:0" onclick="addVac()">Registrar</button><button class="btn soft" style="margin-top:0" onclick="vacOpen=false;rr()">Cancelar</button></div></div>`;}
const list=S.vac.slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
const up=list.filter(v=>v.to>=T),past=list.filter(v=>v.to<T);
h+=`<h2 class="lh">Próximas y actuales</h2>`+(up.length?up.map(vacRow).join(''):`<p class="sub">No hay vacaciones próximas.${isRO()?'':' Toca + para registrar.'}</p>`);
if(past.length)h+=`<h2 class="lh">Pasadas</h2>`+past.slice(-10).reverse().map(vacRow).join('');
return h;
}
function vacRow(v){
const T=todayStr();
const cur=v.from<=T&&T<=v.to;const st=cur?(vKind(v)==='enf'?'Ausente por enfermedad':'De vacaciones'):v.from===addDays(T,1)?'Empieza mañana':v.to<T?'Terminó':'Programada';
const days=Math.round((new Date(v.to)-new Date(v.from))/864e5)+1;
return `<div class="prow"><div class="nm"><b>${esc(pname(v.pid))}</b><br><span class="tag">${vKind(v)==='enf'?'🤒 '+(v.kind==='enfermo'?'Se reportó enfermo':'Se reportó enferma')+' · ':'🌴 Vacaciones · '}${fmtD(v.from)} – ${fmtD(v.to)} · ${days} día${days>1?'s':''}${v.note?' · '+esc(v.note):''}</span></div><span class="tag">${st}</span>${cur?`<button class="x" onclick="toggleVKind('${v.id}')">Cambiar motivo</button>`:''}${cur?`<button class="x" onclick="endVac('${v.id}',0)">Regresó hoy</button><button class="x" onclick="endVac('${v.id}',1)">Hoy no vino por otro motivo</button>`:''}<button class="x del" onclick="rm('vac','${v.id}')">${armed==='vac'+v.id?'¿Borrar?':'Quitar'}</button></div>`;
}
/* Las vacaciones terminan ayer: hoy regresó, o hoy falta por otro motivo (enferma, etc.). */
function toggleVKind(id){const v=S.vac.find(x=>x.id===id);if(!v)return;const o=['vac','enferma','enfermo'],c=vKind(v)==='vac'?'vac':(v.kind==='enfermo'?'enfermo':'enferma');v.kind=o[(o.indexOf(c)+1)%3];save();notice={t:pname(v.pid)+': '+(v.kind==='vac'?'vacaciones':vSick(v))+'.'};rr()}
function endVac(id,absent){const v=S.vac.find(x=>x.id===id);if(!v)return;const T=todayStr(),y=addDays(T,-1);
if(y<v.from)S.vac=S.vac.filter(x=>x.id!==id);else v.to=y;
const p=S.people.find(x=>x.id===v.pid);
Object.keys(S.days).forEach(k=>{if(k>=T&&S.days[k].blocks.some(Boolean))S.days[k].dirty=true});
if(p&&absent){const keep=p.sub;p.present=false;delete p.why;if(keep)p.sub=keep;markDirty();save();tab='personal';notice={t:'Las vacaciones de '+p.name+' terminaron ayer. Hoy está ausente: elige abajo por qué no vino (por ejemplo «Se reportó enferma») y quién la reemplaza.'};render();window.scrollTo(0,0);return}
if(p&&!p.present){p.present=true;delete p.why}
markDirty();save();notice={t:'Las vacaciones de '+(p?p.name:'')+' terminaron ayer. Hoy entra a la rotación.'};rr()}
function addVac(){
const pid=$('#vp').value,from=$('#vf').value,to=$('#vt').value,note=$('#vn').value.trim(),kind=$('#vk')?$('#vk').value:'vac';
if(!from||!to){notice={t:'Elige la fecha de inicio y la del último día.',bad:true};return rr()}
if(to<from){notice={t:'El último día debe ser igual o posterior al primero.',bad:true};return rr()}
if(S.vac.some(v=>v.pid===pid&&v.from<=to&&from<=v.to)){notice={t:pname(pid)+' ya tiene vacaciones registradas en esas fechas.',bad:true};return rr()}
S.vac.push({id:uid(),pid,from,to,note,kind});
Object.keys(S.days).forEach(k=>{if(k>=from&&k<=to&&S.days[k].blocks.some(Boolean))S.days[k].dirty=true});
vacOpen=false;save();notice={t:(kind!=='vac'?'Ausencia por enfermedad registrada: ':'Vacaciones registradas: ')+pname(pid)+', del '+fmtD(from)+' al '+fmtD(to)+'.'};rr();
}

/* Motor de rotación: todos suben un puesto cada bloque y el primero pasa al último. */
function ctx(){
const posts=S.posts.filter(postActive);
const dd=S.days[date],full=new Set(((dd&&dd.rt)||[]).filter(e=>e.from<=0&&e.to>=dd.n-1).map(e=>e.pid));
const P=S.people.filter(p=>here(p)&&!full.has(p.id));
const ops=P.filter(p=>p.role!=='util'&&p.role!=='senior'&&p.role!=='utl'&&p.role!=='sup');
const uts=P.filter(p=>p.role==='util').concat(P.filter(p=>p.role==='utl'),P.filter(p=>p.role==='senior'));
const need=Math.max(0,Math.min(uts.length,posts.length-ops.length));
const E=ops.concat(uts.slice(0,need));
return {posts,ids:E.map(p=>p.id)};
}
function seed(ring,c){
const ok=new Set(c.ids),arr=[];
(ring||[]).forEach(x=>{if(x&&ok.has(x)&&arr.indexOf(x)<0)arr.push(x)});

const RL=()=>Array.isArray(S.rem)?S.rem:(S.rem=[]);

function remHTML(){

else h+=`<label for="rmm">${remK==='cada'?'Cada cuántos minutos':'Dentro de cuántos minutos'}</label><input id="rmm" type="number" inputmode="numeric" min="1" max="1440" value="${remK==='cada'?60:40}"><div class="pbar" style="flex-wrap:wrap;margin-top:6px">`+[15,30,40,60,90,120].map(m=>`<button class="pill" onclick="$('#rmm').value=${m}">${remMin(m)}</button>`).join('')+`</div>`;

function remKind(k){const t=$('#rmt')?$('#rmt').value:'';remK=k;rr();const i=$('#rmt');if(i)i.value=t}

if(remK==='hora'){const at=$('#rma').value;if(!at){notice={t:'Elige la hora.',bad:true};return rr()}r.at=at;r.daily=$('#rmd').value==='1';r.next=remNextAt(at,now)}
else{const m=Math.round(Number($('#rmm').value));if(!(m>=1&&m<=1440)){notice={t:'Escribe los minutos (de 1 a 1440).',bad:true};return rr()}r.min=m;r.next=now+m*60000}

function remToggle(id){const r=RL().find(x=>x.id===id);if(!r)return;r.on=!r.on;if(r.on){const now=Date.now();r.next=r.k==='hora'?remNextAt(r.at,now):now+r.min*60000}save();rr()}

if(!remQ.some(x=>x.id===r.id))remQ.push({id:r.id,text:r.text,at:r.next,late});

/* Orden fijo de los operarios (pestaña Personal). Quien falta y tiene reemplazo: el reemplazo ocupa su lugar
   en el orden; quien falta sin reemplazo se salta. */
function opRing(){
const ok=new Set(ctx().ids),R=[];
/* Quien reemplaza a alguien que falta va en el lugar de esa persona, no en el suyo. */
const subOf=new Set();S.people.forEach(p=>{if(p.role==='op'&&!p.extra&&!here(p)&&p.sub){const s=S.people.find(x=>x.id===p.sub&&here(x));if(s&&ok.has(s.id))subOf.add(s.id)}});
S.people.forEach(p=>{if(p.role!=='op'||p.extra)return;
if(here(p)){if(ok.has(p.id)&&!subOf.has(p.id)&&R.indexOf(p.id)<0)R.push(p.id)}
else{const s=p.sub&&S.people.find(x=>x.id===p.sub&&here(x));if(s&&ok.has(s.id)&&R.indexOf(s.id)<0)R.push(s.id)}});
return R;
}
/* Pones a un operario en un puesto y el resto del bloque se llena solo siguiendo el orden de Personal. */
function fillFrom(b,j,pid,skip){
/* Quien está fuera de la rotación en este bloque (Utility o retrabajo) se salta: el siguiente del orden ocupa su lugar. */
const R=opRing().filter(x=>!(skip&&skip.has(x))),k=R.indexOf(pid),n=b.posts.length;
const L=R.length;
if(k<0)return false;
/* Desde el puesto elegido se recorre el turno completo (13 → 14 → 15…) con el personal que hay, en su orden;
   los puestos que quedan al final del recorrido se dejan vacíos para los extras. */
const M=Math.max(n,L),all=new Array(M).fill(null),md=(a,m)=>((a%m)+m)%m;
for(let t=0;t<L;t++)all[md(j-t,M)]=R[md(k-t,L)];
const arr=all.slice(0,n),tail=all.slice(n).filter(Boolean);
const placed=new Set(arr.concat(tail).filter(Boolean));
b.arr.forEach(x=>{if(x&&!placed.has(x)){tail.push(x);placed.add(x)}});
/* Los puestos que el grupo deja libres los toman los operarios extra, siguiendo el recorrido. */
const xs=tail.filter(x=>isExtra(x)&&here(S.people.find(p=>p.id===x)));
for(let t=L;t<M&&xs.length;t++){const q=md(j-t,M);if(q<n&&!arr[q]){const x=xs.shift();arr[q]=x;tail.splice(tail.indexOf(x),1)}}
for(let q=0;q<n&&xs.length;q++)if(!arr[q]){const x=xs.shift();arr[q]=x;tail.splice(tail.indexOf(x),1)}
b.arr=arr.concat(tail);
return arr.filter(x=>!x).length;
}
function setCell(i,j,pid){
const d=day(),b=d.blocks[i],n=b.posts.length;
/* Si pones a un operario del grupo en un puesto, la rotación arranca desde ahí: el resto del bloque se llena
   siguiendo el orden de Personal (saltando a quien está de Utility o en retrabajo) y los bloques siguientes siguen desde este. */
const skip=new Set([...rtFixed(d,i),...utIds(d,i)]);
if(pid&&!skip.has(pid)&&opRing().indexOf(pid)>=0){
const t={posts:b.posts.slice(),arr:(b.base||b.arr).slice()};
fillFrom(t,j,pid,skip);
b.base=t.arr.slice();b.arr=applyRT(d,i,t.arr,n);
if(i+1<d.n&&canGen())gen(i+1);else{d.nextRing=rotate(b.base).filter(Boolean);save()}
notice={t:'La rotación arranca con '+pname(pid)+' en '+postLabel(S.posts.find(x=>x.id===b.posts[j]))+'. Los bloques siguientes siguen desde aquí.'};
return rr();
}
/* Extras, Utility o dejar sin cubrir: solo un intercambio en ESTE bloque; la rotación (b.base) no se toca. */
if(!b.base)b.base=b.arr.slice();
const prev=b.arr[j]||null;
if(pid){
const q=b.arr.indexOf(pid);
if(q>=0&&q!==j)b.arr[q]=prev;
else if(q<0&&prev)b.arr.push(prev);
b.arr[j]=pid;
}else{b.arr[j]=null;if(prev)b.arr.push(prev)}
b.arr=b.arr.slice(0,n).concat(b.arr.slice(n).filter(Boolean));
notice={t:'Cambio hecho solo en el bloque '+(i+1)+'. La rotación de los bloques siguientes no cambia.'};
save();rr();
}

/* Evaluación del 1 al 5 (escala de la empresa). Confidencial: se guarda cifrada con la contraseña del supervisor (AES-GCM, clave derivada con PBKDF2). Sin la contraseña no se puede leer, ni en este aparato ni en el respaldo. */
const EVL=['','Requiere mejoras significativas','Por debajo de las expectativas','Cumple con los estándares','Supera las expectativas','Desempeño sobresaliente'];
let EV=null,EVK=null,evBusy=false,evMode='';
const b64e=u=>{let s='';new Uint8Array(u).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function evKey(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
let evQ=Promise.resolve();
function evEnc(){if(!evOn())return evQ;const k=EVK,d=JSON.stringify(EV),sl=(S.evx&&S.evx.s)||EVS,run=()=>evEnc1(k,d,sl);evQ=evQ.then(run,run);return evQ}
async function evEnc1(k,d,sl){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(d));S.evx={s:sl,i:b64e(iv),c:b64e(ct)};save()}
let EVS='';
function evLegacy(){const o={};S.people.forEach(p=>{if(p.ev||p.eh)o[p.id]={ev:p.ev||3,eh:p.eh||[]};delete p.ev;delete p.eh;delete p.score;delete p.sh});return o}
function evLock(){EV=null;EVK=null;evMode=''}
const evOn=()=>!!(EV&&EVK);
function evBarHTML(){
if(evOn())return `<div class="evbar on"><span>🔓 <b>Evaluaciones visibles</b>. Solo tú las ves; se ocultan al salir de Personal.</span><div class="pbar"><button class="pill" onclick="evLock();rr()">Ocultar</button><button class="pill" onclick="evMode='chg';rr()">Cambiar contraseña</button></div>${evMode==='chg'?`<label for="evn1">Contraseña nueva</label><input id="evn1" type="password" autocomplete="new-password"><label for="evn2">Repítela</label><input id="evn2" type="password" autocomplete="new-password"><button class="btn soft" onclick="evChange()">Guardar contraseña nueva</button>`:''}</div>`;
if(!S.evx)return `<div class="evbar"><span>🔒 <b>Evaluaciones confidenciales</b>. Crea una contraseña que solo sepas tú. Las evaluaciones quedan cifradas con ella: sin la contraseña nadie las puede ver, ni en el respaldo. Si la olvidas, se pierden.</span><label for="evp1">Contraseña (mínimo 4)</label><input id="evp1" type="password" autocomplete="new-password"><label for="evp2">Repítela</label><input id="evp2" type="password" autocomplete="new-password"><button class="btn" ${evBusy?'disabled':''} onclick="evCreate()">Crear contraseña y ver evaluaciones</button></div>`;
return `<div class="evbar"><span>🔒 <b>Evaluaciones ocultas</b>. Escribe tu contraseña para verlas.</span><div class="pbar"><input id="evp" type="password" autocomplete="current-password" aria-label="Contraseña de evaluaciones" onkeydown="if(event.key==='Enter')evOpen()"><button class="btn" style="margin-top:0;width:auto;padding:10px 18px" ${evBusy?'disabled':''} onclick="evOpen()">Ver</button></div>${evMode==='reset'||armed==='evreset'?`<button class="link" style="color:var(--bad)" onclick="evReset()">${armed==='evreset'?'Toca otra vez: se borran todas las evaluaciones':'Olvidé la contraseña: borrar evaluaciones y empezar de nuevo'}</button>`:`<button class="link" onclick="evMode='reset';rr()">Olvidé la contraseña</button>`}</div>`;
}
async function evCreate(){const a=$('#evp1').value,b=$('#evp2').value;if(a.length<4){notice={t:'La contraseña debe tener al menos 4 caracteres.',bad:true};return rr()}if(a!==b){notice={t:'Las dos contraseñas no coinciden.',bad:true};return rr()}
evBusy=true;try{const salt=crypto.getRandomValues(new Uint8Array(16));EVS=b64e(salt);S.evx=null;EVK=await evKey(a,salt);EV=evLegacy();await evEnc();notice={t:'Contraseña creada. Las evaluaciones quedan cifradas.'}}catch(e){evLock();notice={t:'Este navegador no permite cifrar. Ábrelo desde el enlace https.',bad:true}}evBusy=false;rr()}
async function evOpen(){const pin=$('#evp').value;if(!pin)return;evBusy=true;try{const x=S.evx;const k=await evKey(pin,b64d(x.s));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(x.i)},k,b64d(x.c));EV=JSON.parse(new TextDecoder().decode(pt));EVK=k;EVS=x.s;const L=evLegacy();Object.keys(L).forEach(id=>{if(!EV[id])EV[id]=L[id]});if(Object.keys(L).length)await evEnc();evMode=''}catch(e){evLock();notice={t:'Contraseña incorrecta.',bad:true}}evBusy=false;rr()}
async function evChange(){const a=$('#evn1').value,b=$('#evn2').value;if(a.length<4){notice={t:'La contraseña debe tener al menos 4 caracteres.',bad:true};return rr()}if(a!==b){notice={t:'Las dos contraseñas no coinciden.',bad:true};return rr()}
const salt=crypto.getRandomValues(new Uint8Array(16));EVS=b64e(salt);EVK=await evKey(a,salt);S.evx=null;await evEnc();evMode='';notice={t:'Contraseña cambiada.'};rr()}
function evReset(){if(armed!=='evreset'){armed='evreset';return rr()}armed=null;S.evx=null;evLegacy();evLock();save();notice={t:'Se borraron las evaluaciones. Crea una contraseña nueva.'};rr()}
const scoreOf=p=>{const e=EV&&EV[p.id];return Math.max(1,Math.min(5,Math.round(Number(e&&e.ev)||3)))};
const scoreCol=v=>'hsl('+Math.round((v-1)/4*120)+' 70% 40%)';
function scoreHTML(p){if(!evOn())return '';const v=scoreOf(p),e=EV[p.id]||{},H=e.eh||[],pn=e.pn||0,pp=e.pp||0,c=scoreCol(v),T=todayStr();
const wk=(()=>{const t=new Date();const k=(t.getDay()+6)%7;return addDays(T,-k)})(),mo=T.slice(0,7);
const cnt=(f)=>{const a=H.filter(x=>f(x[0]));return [a.filter(x=>x[1]<0).length,a.filter(x=>x[1]>0).length]};
const W=cnt(d=>d>=wk&&d<=T),M=cnt(d=>d.slice(0,7)===mo),last=H[H.length-1];

return `<div class="score" data-ev="${p.id}"><div class="srow"><span class="sbars" role="meter" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${v}" aria-label="Evaluación de ${esc(p.name)}: ${v}, ${EVL[v]}">${[1,2,3,4,5].map(i=>`<i style="height:${8+i*6}px;background:${i<=v?c:'var(--line)'}"></i>`).join('')}</span><span class="sl"><b style="color:${c}">${v}</b> ${EVL[v]}</span></div>
<div class="srow"><span class="sg"><button class="pill sinc" aria-label="Anotar incidencia de ${esc(p.name)}" onclick="rate('${p.id}',-1)">− Incidencia</button><span class="dots" title="Cada 3 incidencias baja un nivel">${dots(pn,'var(--bad)')}</span></span><span class="sg"><button class="pill sgood" aria-label="Anotar buena acción de ${esc(p.name)}" onclick="rate('${p.id}',1)">+ Buena acción</button><span class="dots" title="Cada 3 buenas acciones sube un nivel">${dots(pp,'#2E8B3A')}</span></span></div>
<small>Semana: ${W[0]} incidencia${W[0]===1?'':'s'}, ${W[1]} buena${W[1]===1?'':'s'} · Mes: ${M[0]} incidencia${M[0]===1?'':'s'}, ${M[1]} buena${M[1]===1?'':'s'}${last?` · última ${last[1]<0?'incidencia':'buena acción'} el ${esc(fmtD(last[0]))}${last[2]?(last[2]<0?' (bajó de nivel)':' (subió de nivel)'):''} <button class="link" style="font-size:14px;padding:0 4px" onclick="undoRate('${p.id}')">Deshacer</button>`:''}</small></div>`}
/* Cada 3 incidencias baja un nivel; cada 3 buenas acciones sube uno. Al cambiar de nivel, ese contador vuelve a 0. */
async function rate(id,dv){if(!evOn())return;const p=S.people.find(x=>x.id===id);if(!p)return;const e=EV[id]=EV[id]||{ev:3,eh:[]};e.ev=scoreOf(p);let ch=0;
if(dv<0){e.pn=(e.pn||0)+1;if(e.pn>=3){e.pn=0;if(e.ev>1){e.ev--;ch=-1}}}else{e.pp=(e.pp||0)+1;if(e.pp>=3){e.pp=0;if(e.ev<5){e.ev++;ch=1}}}
e.eh=(e.eh||[]).concat([[todayStr(),dv,ch]]).slice(-500);evRR(id);evEnc()}
/* Redibuja sin mover la fila que se tocó. */
function evRR(id){const sel='[data-ev="'+id+'"]',a=document.querySelector(sel),y0=a?a.getBoundingClientRect().top:null;rr();const b=document.querySelector(sel);if(b&&y0!=null)window.scrollBy(0,b.getBoundingClientRect().top-y0)}
async function undoRate(id){if(!evOn())return;const e=EV[id];if(!e||!e.eh||!e.eh.length)return;const [d,dv,ch]=e.eh.pop();
if(ch){e.ev-=ch;if(dv<0)e.pn=2;else e.pp=2}else if(dv<0)e.pn=Math.max(0,(e.pn||0)-1);else e.pp=Math.max(0,(e.pp||0)-1);evRR(id);evEnc()}
function movePerson(id,dir){const i=S.people.findIndex(p=>p.id===id),j=i+dir;if(i<0||j<0||j>=S.people.length)return;const t=S.people[i];S.people[i]=S.people[j];S.people[j]=t;markDirty();save();rr()}

const WHY=[['enferma','Se reportó enferma'],['enfermo','Se reportó enfermo'],['vac','Vacaciones'],['baja','Pidió la baja']];

function absentCtl(p){

if(p.extra||!absentOn(p,T))return '';

else h+=`<span class="tag">${isUtil(p)?'No hay Utility disponibles para reemplazarlo. Agrega al Utility que viene en su lugar y márcalo como Extra.':'No hay operarios disponibles para reemplazarlo. Agrega en la lista de abajo a quien viene en su lugar.'}</span>`;

function asisAuto(){

abs.forEach(p=>{const s=p.sub&&pres.find(x=>x.id===p.sub);if(s){used.add(s.id);L.push(s.name+(isUtil(s)?' (Utility)':'')+' reemplaza a '+p.name+(isUtil(p)?' (Utility)':'')+', que '+whyTxt(p)+'.')}});

/* Guía */
function guideBody(){return `<div id="gbody">
<p>Esta aplicación arma la rotación del personal de tu grupo en bloques de horas, dice quién cubre a quién en el desayuno y el almuerzo, lleva las vacaciones, el calendario del mes y prepara el reporte del turno. Cada grupo tiene sus propios datos y no afecta a los demás.</p>
<div class="step"><h3><b>1</b>Crea tu grupo</h3><p>En la primera pantalla escribe el <b>número de tu grupo</b> y elige el horario: <b>Día (6:00 a 18:00)</b> o <b>Noche (18:00 a 6:00)</b>. Toca «Crear grupo».</p></div>
<div class="step"><h3><b>2</b>Pon tus máquinas</h3><p>En <b>Máquinas</b>, al final, escribe los números de máquina de la línea 1 y de la línea 2 y toca «Guardar máquinas». Arriba marca cada una:</p><dl><dt>Encendida</dt><dd>Trabaja normal.</dd><dt>Detenida</dt><dd>Parada por un motivo, pero su operario sigue en la rotación: cubre descansos, va a retrabajo o cubre máquinas sin puesto.</dd><dt>Cero operario</dt><dd>Encendida pero sin operario fijo: la atiende el utility.</dd><dt>Parada</dt><dd>Fuera todo el turno. Sale de la rotación. Elige el motivo.</dd></dl><p>En <b>Puestos de rotación</b> cada puesto es una máquina o varias que cubre una sola persona (ej. «3, 4, 5»). El orden de esa lista es el orden en que se rota.</p></div>
<div class="step"><h3><b>2b</b>Planta compartida entre los 4 grupos</h3><p>Cuando el equipo está activado, <b>las máquinas y los puestos son los mismos para los 4 grupos</b>: encendida, detenida, cero operario, parada, el motivo, la descripción, la prioridad y los puestos de rotación. El supervisor que está trabajando los mantiene al día, y los demás lo ven al instante en su teléfono para preparar su turno. En Hoy y en Máquinas sale quién hizo el último cambio y a qué hora, y si con tu personal te alcanza para los puestos o necesitas extras.</p><p><b>Importante:</b> cualquier cambio que haga un supervisor, <b>bien o mal hecho, se refleja en todos los demás</b>. Por eso, antes de entregar el turno, revisa que las máquinas estén como de verdad quedan en la planta. Las máquinas que marques <b>detenidas o paradas salen así en el reporte</b> aunque estén funcionando, y las que dejes <b>encendidas salen produciendo</b> aunque estén paradas. Ese error le llega al reporte y a la organización del <b>supervisor que entra</b>.</p><p>Lo que sigue siendo de cada grupo: su personal, su rotación, qué hace el operario de una máquina detenida (cubre descansos, retrabajo o utility), vacaciones, plan y reporte.</p></div>
<div class="step"><h3><b>3</b>Agrega al personal</h3><p>En <b>Personal</b> escribe los nombres, uno por línea, elige la función (Operario, Utility, Utility senior o Supervisor) y toca «Agregar».</p><p><b>El orden de la lista es el orden de la rotación</b>: cada persona va detrás de la de arriba. Súbelos o bájalos con las flechas <b>↑ ↓</b> hasta que quede igual que en la planta.</p></div>
<div class="step"><h3><b>4</b>Faltas, extras y reemplazos</h3><ol><li>Quien no vino: toca <b>«Hoy sí»</b> para que diga «Hoy no» y elige el motivo y quién lo reemplaza.</li><li>Marca como <b>Extra</b> a los operarios y Utility que vienen de fuera del grupo. Elige por quién viene cada uno: toma su lugar en la rotación y su turno de comida.</li><li>Un <b>Utility de otro equipo</b> que viene a cubrir al Utility que falta: márcalo Extra y elige por cuál Utility viene.</li><li>Los extras que no vienen por nadie cubren los puestos que quedan vacíos y salen en el reporte como extras necesitados.</li></ol><p><b>No borres a los extras.</b> Los días que no vienen déjalos en «Hoy no» y quedan guardados para cuando vuelvan.</p></div>
<div class="step"><h3><b>5</b>Evaluaciones confidenciales</h3><p>En <b>Personal</b>, debajo de «Tu personal», crea una <b>contraseña</b> que solo sepas tú. Las evaluaciones quedan cifradas con ella: nadie más las puede ver, ni en este teléfono ni en el código de respaldo. Para verlas, escribe la contraseña y toca «Ver»; se ocultan solas al salir de Personal. <b>Si la olvidas, no se pueden recuperar</b>: solo se pueden borrar y empezar de nuevo.</p><p>Cada persona de tu grupo tiene su nivel (los extras y el supervisor no se evalúan):</p><dl><dt>1</dt><dd>Requiere mejoras significativas</dd><dt>2</dt><dd>Por debajo de las expectativas</dd><dt>3</dt><dd>Cumple con los estándares (todos empiezan aquí)</dd><dt>4</dt><dd>Supera las expectativas</dd><dt>5</dt><dd>Desempeño sobresaliente</dd></dl><ol><li>Toca <b>− Incidencia</b> cada vez que haya una llamada de atención. Se llena un puntito rojo; <b>cada 3 incidencias baja un nivel</b>.</li><li>Toca <b>+ Buena acción</b> cuando ayude, tenga buena actitud o haga bien su trabajo. <b>Cada 3 buenas acciones sube un nivel</b>.</li><li>Abajo ves cuántas lleva esta semana y este mes, con la fecha de la última. Si tocaste por error, toca «Deshacer».</li></ol></div>
<div class="step"><h3><b>6</b>Desayuno y almuerzo</h3><p>Al final de <b>Personal</b> pon la hora y los minutos de cada comida y elige quién sale en cada turno, o toca «Repartir». Los operarios de máquinas detenidas cubren primero, luego los utility y por último el supervisor.</p></div>
<div class="step"><h3><b>7</b>Pon tus días de trabajo en Mes</h3><p>En <b>Mes</b> elige tu patrón: 2-2-3, Rotación (ej. 4 y 4) o Días fijos. Toca un día para cambiarlo solo ese día. Los días libres la rotación no avanza y sigue en tu próximo día de trabajo.</p></div>
<div class="step"><h3><b>8</b>La rotación del día en Hoy</h3><ol><li>Toca <b>«Generar rotación»</b>. Arriba ves quién está en cada máquina ahora y cuánto falta para el cambio.</li><li>Para decir dónde empieza alguien, en un bloque elige a la persona en su máquina (ej. <b>Ana en la máquina 13</b>). A partir de ahí toda la rotación sigue sola, bloque tras bloque y día tras día.</li><li>Si cambia el personal o las máquinas, toca «Recalcular rotación» desde el bloque actual.</li><li><b>⏰ Alguien llegó tarde</b> y <b>🚪 Alguien se va antes de hora</b> lo anotan con la hora y salen en el reporte.</li><li>Los Utility cambian de línea cada cierto tiempo: toca <b>«⇄ Cambio de líneas»</b>, junto a sus nombres en Hoy, y el de la línea 1 pasa a la 2 y el de la 2 a la 1. Los de «Ambas líneas» no se mueven.</li><li>En <b>Retrabajo y Utility</b> eliges quién va a retrabajo y a qué operario sacas a cubrir como Utility.</li><li><b>Imprimir desayuno y almuerzo</b>: hoja carta, etiqueta Zebra por turno o notas por persona.</li></ol></div>
<div class="step"><h3><b>9</b>Recordatorios (Avisos)</h3><p>En <b>Avisos</b> escribe lo que no se te puede olvidar y elige cuándo: <b>Cada…</b> (ej. chequear los secadores cada 1 hora), <b>Dentro de…</b> (ej. en 40 minutos encender temperatura) o <b>A una hora</b> (todos los días o una sola vez). A la hora suena una alarma, vibra y sale el aviso en pantalla: toca «Hecho» o «En 5 min». En Hoy, arriba, ves el próximo recordatorio.</p><p><b>Solo suenan con la app abierta en pantalla.</b> Si apagas la pantalla o cambias de app, el teléfono la pausa; al volver te salen los que se pasaron. Usa «Probar la alarma» para comprobar el volumen.</p></div>
<div class="step"><h3><b>10</b>Vacaciones</h3><p>En <b>Vacaciones</b> registra las aprobadas. Esos días la persona sale de la rotación y la app avisa el día antes.</p></div>
<div class="step"><h3><b>11</b>El reporte sale solo</h3><p>En <b>Reporte</b> las máquinas y la asistencia se llenan con lo que marcaste. Si marcas bien las máquinas detenidas y paradas con su motivo, quién faltó y por quién viene cada extra, el reporte sale completo. Agrega lo demás y toca «Generar reporte» para copiarlo o mandarlo por WhatsApp. También sale el reporte para Recursos Humanos.</p></div>
<div class="step"><h3><b>12</b>Guarda un respaldo</h3><p>Todo queda guardado <b>solo en este teléfono o computadora</b>. En <b>Grupo</b> toca «Copiar código de respaldo», mándatelo y pégalo en la primera pantalla del otro teléfono, en «Cargar un respaldo».</p></div>
<div class="step"><h3><b>13</b>Manda tus sugerencias</h3><p>Al final de <b>Cómo usar</b> hay un formulario de <b>Sugerencias</b>. Escribe qué te gustaría cambiar y mándalo por WhatsApp.</p></div>
<p class="sub" style="margin-top:12px">Para crear otro grupo toca «+ Nuevo grupo» arriba. Si en un mismo teléfono hay varios grupos, toca «Cambiar de grupo» para pasar de uno a otro. Un grupo nunca cambia los datos de otro.</p></div>`}

const NIGHT_W=[[/\bel desayuno\b/g,'la cena'],[/\bel almuerzo\b/g,'la merienda'],[/\bdel desayuno\b/g,'de la cena'],[/\bdel almuerzo\b/g,'de la merienda'],[/\bal desayuno\b/g,'a la cena'],[/\bal almuerzo\b/g,'a la merienda'],[/DESAYUNO/g,'CENA'],[/ALMUERZO/g,'MERIENDA'],[/Desayuno/g,'Cena'],[/Almuerzo/g,'Merienda'],[/desayuno/g,'cena'],[/almuerzo/g,'merienda']];
const isNight=()=>!!(S&&S.g&&S.shift==='noche');
function nightTxt(t){if(!isNight()||typeof t!=='string')return t;NIGHT_W.forEach(([r,v])=>{t=t.replace(r,v)});return t}
function nightDom(root){if(!isNight()||!root)return;try{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(n.parentNode&&/^(TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName))continue;const v=nightTxt(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
root.querySelectorAll('[aria-label],[placeholder],[title]').forEach(e=>{['aria-label','placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const x=nightTxt(v);if(x!==v)e.setAttribute(a,x)}})})}catch(e){}}
try{if(navigator.clipboard&&navigator.clipboard.writeText){const _wt=navigator.clipboard.writeText.bind(navigator.clipboard);navigator.clipboard.writeText=t=>_wt(nightTxt(t))}}catch(e){}

/* Solo ver: se desactiva todo lo que cambia datos; quedan pestañas, fechas, imprimir y copiar. */
const RO_OK=new Set(['toggleCfg','planChk','setTab','setDate','calNav','leave','openGroup','syncBoth','openPrint','doPrint','setPfmt','setNout','setZmg','setZor','setPkind','printing','window.scrollTo','var','document.getElementById','copyDay','copyGuide','startGuide','cloud.signIn','cloudOut','sendSug','copySug','teamOpen']);
const roName=a=>{const m=String(a||'').trim().match(/^[A-Za-z_$][\w$.]*/);return m?m[0]:''};
function roAllowed(el){for(const at of ['onclick','onchange','oninput']){const v=el.getAttribute(at);if(v&&!RO_OK.has(roName(v)))return false}return true}
function roLock(){const app=$('#app');if(!app)return;const ro=isRO();app.classList.toggle('ro',ro);if(!ro)return;
app.querySelectorAll('[onclick],[onchange],[oninput]').forEach(el=>{if(roAllowed(el))return;if('disabled' in el)el.disabled=true;el.classList.add('rolk');el.setAttribute('aria-disabled','true')});
app.querySelectorAll('input:not([type=date]):not([type=month]),textarea,select').forEach(el=>{if(roAllowed(el)&&(el.getAttribute('onchange')||el.getAttribute('oninput')))return;el.disabled=true;el.classList.add('rolk')})}
['click','change','input'].forEach(ev=>document.addEventListener(ev,e=>{if(!isRO())return;const el=e.target.closest&&e.target.closest('[onclick],[onchange],[oninput]');if(el&&el.closest('#app')&&!roAllowed(el)){e.stopPropagation();e.preventDefault()}},true));

function openTeam(){teamOpen=true;teamEdit=null;armed=null;render();window.scrollTo(0,0)}
let claimName='';
async function claimAdmin(){const v=($('#adn')&&$('#adn').value||'').trim();if(v)claimName=v;if(armed!=='claim'){armed='claim';rr();const i=$('#adn');if(i)i.value=claimName;return}armed=null;const n=claimName;notice={t:'Activando el equipo…'};rr();const r=await cloud.claimAdmin(n);notice=r==='ok'?{t:'Listo: eres el administrador. Ahora agrega a tu equipo en «👥 Administrar equipo».'}:{t:r,bad:true};rr()}
const ROLES=[['supervisor','Supervisor','Edita la rotación de su grupo'],['utility','Solo ver','Ve la rotación y los descansos, no cambia nada'],['admin','Administrador','Maneja el equipo y todos los grupos']];
const parseGs=v=>String(v||'').split(/[,;\s]+/).map(x=>x.trim().replace(/^grupo/i,'')).filter(Boolean);
function memberForm(m){const isMe=m&&m.email===String(cloud.user.email||'').toLowerCase();const r=m?m.rol:'supervisor';
return `<div class="cbox"><h2 style="margin-top:0">${m?'Cambiar a '+esc(m.nombre||m.email):'Agregar a una persona'}</h2>
${m?`<p class="sub" style="margin:0">${esc(m.email)}</p>`:`<label for="tm_e">Correo de Google</label><input id="tm_e" type="email" inputmode="email" autocomplete="off" placeholder="nombre@gmail.com">`}
<label for="tm_n">Nombre</label><input id="tm_n" value="${esc(m&&m.nombre||'')}" placeholder="Ej. Diana Pozo" autocomplete="off">
${isMe?'':`<label for="tm_r">Rol</label><select id="tm_r">${ROLES.map(([k,l,d])=>`<option value="${k}" ${r===k?'selected':''}>${l} — ${d}</option>`).join('')}</select>`}
${isMe?'':`<label for="tm_g">Grupos (números, separados por coma)</label><input id="tm_g" inputmode="numeric" value="${esc((m&&m.grupos||[]).join(', '))}" placeholder="Ej. 3"><p class="sub" style="margin:4px 0 0">Grupos en la nube: ${cloud.allGroups.length?cloud.allGroups.map(esc).join(', '):'ninguno todavía'}. El administrador ve todos sin asignarlos.</p>`}
<div class="pbar" style="margin-top:12px"><button class="btn" style="margin-top:0" onclick="saveMember(${m?`'${esc(m.email)}'`:'null'})">Guardar</button><button class="btn soft" style="margin-top:0" onclick="teamEdit=null;rr()">Cancelar</button></div></div>`}
function equipoHTML(){const c=window.cloud;if(!c||!c.isAdmin())return `<p class="sub">Solo el administrador ve esta parte.</p>`;
let h=`<p class="sub">Cada persona entra con su correo de Google. Supervisor: edita su grupo. Solo ver: ve la rotación de su grupo sin poder cambiarla. Si alguien se va, quítalo y su grupo se borra de sus aparatos; luego asigna el grupo a otra persona.</p>`;
if(teamEdit==='new')h+=memberForm(null);else h+=`<button class="btn" onclick="teamEdit='new';rr()">+ Agregar persona</button>`;
const me=String(c.user.email||'').toLowerCase();
h+=`<h2 class="lh">Personas (${c.members.length})</h2>`;
c.members.forEach(m=>{if(teamEdit===m.email){h+=memberForm(m);return}
const rl=(ROLES.find(x=>x[0]===m.rol)||[0,m.rol])[1];const k='dm:'+m.email;
h+=`<div class="cbox" style="margin:8px 0"><p style="margin:0"><b>${esc(m.nombre||m.email)}</b>${m.email===me?' (tú)':''}</p><p class="sub" style="margin:2px 0 0">${esc(m.email)}<br>${esc(rl)}${m.rol==='admin'?' · todos los grupos':' · '+((m.grupos||[]).length?'Grupo '+m.grupos.map(esc).join(', '):'sin grupo')}</p>
<div class="pbar" style="margin-top:8px"><button class="btn soft" style="margin-top:0" onclick="teamEdit='${esc(m.email)}';armed=null;rr()">Cambiar</button>${m.email===me?'':`<button class="btn soft" style="margin-top:0;border-color:var(--bad);color:var(--bad)" onclick="delMember('${esc(m.email)}')">${armed===k?'Toca otra vez para quitar':'Quitar'}</button>`}</div></div>`});
const asg={};c.members.forEach(m=>{if(m.rol!=='admin')(m.grupos||[]).forEach(g=>{(asg[g]=asg[g]||[]).push(m.nombre||m.email)})});
h+=`<h2 class="lh">Grupos</h2>`+(c.allGroups.length?c.allGroups.map(g=>`<p style="margin:6px 0"><b>Grupo ${esc(g)}</b>: <span class="sub">${asg[g]?asg[g].map(esc).join(', '):'nadie asignado'}</span></p>`).join(''):`<p class="sub">Todavía no hay grupos en la nube.</p>`);
return h}
async function saveMember(email){const isNew=!email;email=email||($('#tm_e')&&$('#tm_e').value)||'';const n=$('#tm_n')?$('#tm_n').value:'';const me=String(cloud.user.email||'').toLowerCase();const self=email.toLowerCase()===me;
const r=self?'admin':($('#tm_r')?$('#tm_r').value:'supervisor');const gs=self?[]:parseGs($('#tm_g')?$('#tm_g').value:'');
if(isNew&&cloud.members.some(m=>m.email===email.trim().toLowerCase())){notice={t:'Esa persona ya está en el equipo. Toca «Cambiar» en su tarjeta.',bad:true};return rr()}
if(r!=='admin'&&!gs.length){notice={t:'Escribe al menos un grupo para esa persona.',bad:true};return rr()}
const res=await cloud.saveMember(email,r,n,gs);if(res==='ok'){teamEdit=null;notice={t:'Guardado. La persona entra a la app con ese correo y verá su grupo.'}}else notice={t:res,bad:true};rr()}
async function delMember(email){const k='dm:'+email;if(armed!==k){armed=k;return rr()}armed=null;const res=await cloud.delMember(email);notice=res==='ok'?{t:'Quitada del equipo. Su grupo se borra de sus aparatos la próxima vez que abran la app.'}:{t:res,bad:true};rr()}
/* Nube: entrar con Google y sincronizar los grupos entre aparatos (cloud.js). */
function cloudHTML(inGroup){const c=window.cloud;if(!c||!c.on)return '';
const err=c.err?`<p class="sub" style="color:var(--bad);margin:8px 0 0">${esc(c.err)}</p>`:'';
if(!c.ready)return `<div class="cbox"><b>☁ Conectando con la nube…</b>${err}</div>`;
if(!c.user)return `<div class="cbox"><h2 style="margin-top:0">☁ Sincronizar con tu correo</h2><p class="sub">Entra con tu cuenta de Google y tus grupos se guardan en la nube. Lo que cambies en el teléfono aparece solo en la computadora o la tablet donde entres con el mismo correo.</p><button class="btn" style="margin-top:0" onclick="cloud.signIn()">Entrar con Google</button>${err}</div>`;
if(!c.mode)return `<div class="cbox"><b>☁ Revisando tu acceso…</b> ${esc(c.user.email)}${err}</div>`;
const outB=`<button class="btn soft" style="margin-top:10px" onclick="cloudOut()">${armed==='cout'?'Toca otra vez para salir':'Salir de la cuenta'}</button>`;
if(c.mode==='sinacceso')return `<div class="cbox"><p style="margin:0"><b>🔒 Sin acceso</b></p><p class="sub" style="margin:4px 0 0">Tu correo ${esc(c.user.email)} no está en el equipo. Pide al administrador que te agregue con este correo. Mientras tanto, lo que hagas queda solo en este aparato.</p>${err}${outB}</div>`;
const roleTxt=c.mode==='compartido'?` · ${({admin:'Administrador',supervisor:'Supervisor',utility:'Solo ver'})[c.role]||''}${c.role!=='admin'?' · '+(c.groups.length?'Grupo '+c.groups.map(esc).join(', '):'sin grupo asignado'):''}`:'';
const claim=c.canClaim?`<div style="margin-top:12px;padding-top:12px;border-top:2px solid var(--line)"><b>👥 Activar el equipo</b><p class="sub" style="margin:4px 0 8px">Te vuelves administrador: agregas a los supervisores y utilities con su correo, les das su rol y su grupo, y los quitas cuando se vayan. Tus grupos pasan a la nube del equipo. Antes tienen que estar pegadas las reglas nuevas en Firebase.</p><label for="adn" style="margin-top:0">Tu nombre</label><input id="adn" placeholder="Ej. Aramis" autocomplete="off"><button class="btn" onclick="claimAdmin()">${armed==='claim'?'Toca otra vez para activar':'Hacerme administrador'}</button></div>`:'';
return `<div class="cbox"><p style="margin:0"><b>☁ Sincronizado</b> con ${esc(c.user.email)}${roleTxt}</p><p class="sub" style="margin:4px 0 0">${c.pending?'Guardando en la nube…':'Al día'+(c.last?' · '+hhmm(c.last):'')}${inGroup?'':'. Tus grupos de la cuenta salen en la lista de abajo.'}</p>${err}${claim}${inGroup&&S&&S.g&&!S.example&&c.syncs(S.g)&&!c.readOnly()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" style="margin-top:0" onclick="syncPull()">⬇ Traer lo último</button><button class="btn soft" style="margin-top:0" onclick="syncPush()">${armed==='spush'?'Toca otra vez: reemplaza la nube':'⬆ Subir lo de aquí'}</button></div><p class="sub" style="margin:6px 0 0">Traer: pone aquí lo que guardaste en el otro aparato. Subir: manda lo de este aparato a la nube y al otro aparato.</p>`:''}<button class="btn soft" style="margin-top:10px" onclick="cloudOut()">${armed==='cout'?'Toca otra vez para salir':'Salir de la cuenta'}</button></div>`}
async function syncBoth(){if(!S||!S.g)return;if(saveT)saveNow();notice={t:'Sincronizando…'};rr();const r=await cloud.sync(S.g);notice=r==='up'?{t:'Sincronizado ('+hhmm(Date.now())+'): lo de este aparato era lo más nuevo y se subió a la nube.'}:r==='down'?{t:'Sincronizado ('+hhmm(Date.now())+'): ya tienes lo último de la nube.'}:{t:r,bad:true};rr()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.cloud&&cloud.user&&S&&S.g&&!S.example&&!saveT)cloud.sync(S.g).catch(()=>{})});
async function syncPull(){if(!S||!S.g)return;clearTimeout(saveT);saveT=null;cDirty=false;notice={t:'Trayendo de la nube…'};rr();const r=await cloud.pull(S.g);notice=r==='ok'?{t:'Listo: ya tienes lo último de la nube ('+hhmm(Date.now())+').'}:{t:r,bad:true};rr()}
async function syncPush(){if(!S||!S.g)return;if(armed!=='spush'){armed='spush';return rr()}armed=null;cDirty=true;saveNow();notice={t:'Subiendo a la nube…'};rr();const r=await cloud.pushNow(S.g);notice=r==='ok'?{t:'Listo: lo de este aparato ya está en la nube. El otro aparato lo recibe solo; si no, toca «Traer lo último» allá.'}:{t:r,bad:true};rr()}
function cloudOut(){if(armed!=='cout'){armed='cout';return rr()}armed=null;cloud.signOut()}
function cloudBusy(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
let cloudKey='';
function cloudUI(){if(!ready||printing)return;const c=window.cloud||{};const k=[c.mode,c.role,(c.groups||[]).join(','),c.user&&c.user.uid,(c.avisos||[]).map(a=>a.id+':'+Object.keys(a.vistos||{}).length).join(','),c.avErr||''].join('|');const roleChanged=k!==cloudKey;cloudKey=k;if((roleChanged||teamOpen||!S||!S.g||tab==='grupo'||tab==='equipo'||tab==='plan')&&!cloudBusy()){const keep={};document.querySelectorAll('#app input[id],#app textarea[id]').forEach(e=>{if(e.value)keep[e.id]=e.value});rr();for(const id in keep){const e=document.getElementById(id);if(e&&!e.value)e.value=keep[id]}}}
let cloudWait=null;
function cloudApply(g,o,force){g=String(g);if(!o||typeof o!=='object')return;o.g=g;
if(S&&String(S.g)===g&&!S.example){if(!force&&(saveT||cloudBusy())){clearTimeout(cloudWait);cloudWait=setTimeout(()=>cloudApply(g,o),2000);return}
const t=tab;lsSet(GKEY+'g:'+g,o);S=o;prepS();if(plantOn())plantMerge(cloud.plant);tab=t;if(!printing)rr();return}
lsSet(GKEY+'g:'+g,o);if(!S||!S.g)render()}
function cloudRemove(g){g=String(g);lsDel(GKEY+'g:'+g);if(S&&String(S.g)===g&&!S.example){clearTimeout(saveT);saveT=null;S=defaults();SHIFT='dia';tab='hoy';notice={t:'El grupo '+g+' se borró desde otro aparato.'};render()}else if(!S||!S.g)render()}

/* Arranque: abre el último grupo usado en este dispositivo. */
(function(){
const last=lsGet(GKEY+'last');let o=last!=null?lsGet(GKEY+'g:'+last):null;
if(o){let msg=null;if(!o.machines){o=convertSimple(o);msg='El grupo '+o.g+' se pasó a la versión completa. Revisa Máquinas, Personal y Desayuno y almuerzo.'}S=o;prepS();date=nextShift();notice=msg?{t:msg}:null;if(msg)saveNow()}
else{S=defaults();SHIFT='dia'}
ready=true;render();
setInterval(()=>{if(!ready||!S.g||printing||tab!=='hoy'||date!==todayStr()||document.hidden)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;rr()},60000);
})();

</script>
